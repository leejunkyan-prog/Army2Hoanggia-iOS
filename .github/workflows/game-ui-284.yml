name: Build Army2 iOS 284
on:
  workflow_dispatch:
  push:
    branches: [qa/ios-284-performance]
permissions:
  contents: read
concurrency:
  group: game-ui-284
  cancel-in-progress: true
jobs:
  framework:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify iPhone framework
        run: bash native-wheel/build_284.sh
      - name: Test compiled ARM64 snapshot and inventory bridges
        shell: bash
        run: |
          python3 -m venv native-wheel/build/device-qa
          native-wheel/build/device-qa/bin/pip install --quiet lief unicorn
          py=native-wheel/build/device-qa/bin/python
          bin=native-wheel/build/QA/AGWheel.framework/AGWheel
          "$py" native-wheel/test_native_watch.py "$bin" | tee native-wheel/build/watch-284.txt
          "$py" native-wheel/test_inventory_device282.py "$bin" | tee native-wheel/build/inventory-284.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Army2HoangGia-Build284-framework
          path: |
            native-wheel/build/framework-284.zip
            native-wheel/build/watch-284.txt
            native-wheel/build/inventory-284.txt
          if-no-files-found: error
          retention-days: 14
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node native-wheel/test_lobby.js
      - run: node native-wheel/test_native_watch_ui.js

